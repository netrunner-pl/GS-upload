<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <base target="_top">
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        max-width: 720px;
        margin: 40px auto;
        padding: 0 16px;
        color: #202124;
      }
      textarea {
        width: 100%;
        height: 110px;
        padding: 12px;
        border: 1px solid #dadce0;
        border-radius: 8px;
        font-size: 15px;
        resize: vertical;
        box-sizing: border-box;
      }
      button {
        background: #1a73e8;
        color: white;
        border: none;
        padding: 10px 24px;
        border-radius: 6px;
        font-size: 14px;
        cursor: pointer;
        margin-top: 10px;
      }
      button:disabled { background: #ccc; }
      #output {
        margin-top: 24px;
        padding: 16px;
        border-radius: 8px;
        background: #f8f9fa;
        white-space: pre-wrap;
        line-height: 1.5;
        border: 1px solid #e8eaed;
      }
    </style>
  </head>
  <body>
    <h2>Aplikacja AI</h2>
    <textarea id="promptInput" placeholder="Wpisz swoje zapytanie..."></textarea>
    <br>
    <button id="sendBtn" onclick="sendPrompt()">Wyślij</button>

    <div id="output" style="display: none;"></div>

    <script>
      function sendPrompt() {
        const input = document.getElementById('promptInput').value.trim();
        const btn = document.getElementById('sendBtn');
        const output = document.getElementById('output');

        if (!input) return;

        btn.disabled = true;
        btn.innerText = 'Generowanie...';
        output.style.display = 'block';
        output.innerText = 'Czekam na odpowiedź...';

        google.script.run
          .withSuccessHandler(function(response) {
            output.innerText = response;
            btn.disabled = false;
            btn.innerText = 'Wyślij';
          })
          .withFailureHandler(function(err) {
            output.innerText = 'Wystąpił błąd: ' + err.message;
            btn.disabled = false;
            btn.innerText = 'Wyślij';
          })
          .askGemini(input);
      }
    </script>
  </body>
</html>
